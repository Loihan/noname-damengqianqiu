<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- 梦陆逊 · 焚灭 背景：业火焚天 · 营烬连天（纯图形，无文字） -->
  <defs>
    <linearGradient id="lxf-bg-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0e08"/>
      <stop offset="0.45" stop-color="#2a130a"/>
      <stop offset="0.78" stop-color="#3a1a0c"/>
      <stop offset="1" stop-color="#1a0b06"/>
    </linearGradient>
    <linearGradient id="lxf-bg-fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#e04818" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#8a1f0e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1c0e08" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lxf-bg-glow" cx="50%" cy="104%" r="72%">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#e2651c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1c0e08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lxf-bg-smoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f0ea" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2f0ea" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f2f0ea" stop-opacity="0"/>
    </linearGradient>
    <filter id="lxf-bg-blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="lxf-bg-soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="900" height="520" fill="url(#lxf-bg-base)"/>
  <rect width="900" height="520" fill="url(#lxf-bg-glow)"/>

  <!-- 底部焚城火海（连营火烧） -->
  <g filter="url(#lxf-bg-blur)">
    <path d="M-60 520 C 60 430 140 300 210 330 C 260 350 300 430 360 400 C 420 370 440 280 520 300 C 590 318 610 400 680 380 C 750 360 790 300 860 330 C 900 345 920 420 960 440 L 960 540 L -60 540 Z" fill="url(#lxf-bg-fire)"/>
  </g>

  <!-- 连营帐寨剪影 -->
  <g filter="url(#lxf-bg-soft)" opacity="0.6">
    <path d="M60 520 L60 410 L78 390 L96 410 L96 520 Z" fill="#12080a"/>
    <path d="M120 520 L120 420 L142 398 L164 420 L164 520 Z" fill="#12080a"/>
    <path d="M300 520 L300 440 L318 420 L336 440 L336 520 Z" fill="#12080a"/>
    <path d="M600 520 L600 430 L620 408 L640 430 L640 520 Z" fill="#12080a"/>
    <path d="M740 520 L740 452 L758 432 L776 452 L776 520 Z" fill="#12080a"/>
    <path d="M430 520 C 430 470 470 470 470 470 C 470 470 510 470 510 520 Z" fill="#12080a"/>
  </g>

  <!-- 余烬火星 -->
  <g fill="#ffd27a">
    <circle cx="150" cy="210" r="3" opacity="0.85"/>
    <circle cx="260" cy="150" r="2.2" opacity="0.75"/>
    <circle cx="390" cy="190" r="3.4" opacity="0.85"/>
    <circle cx="520" cy="130" r="2.4" opacity="0.7"/>
    <circle cx="640" cy="200" r="3" opacity="0.8"/>
    <circle cx="760" cy="150" r="2.6" opacity="0.75"/>
    <circle cx="470" cy="90" r="1.8" opacity="0.6"/>
    <circle cx="330" cy="230" r="2" opacity="0.7"/>
    <circle cx="700" cy="250" r="2.4" opacity="0.7"/>
  </g>

  <!-- 玉青云烟（绿）一缕 -->
  <g filter="url(#lxf-bg-blur)" opacity="0.4">
    <path d="M60 60 C 200 20 360 90 460 60 C 560 30 640 90 780 50" fill="none" stroke="url(#lxf-bg-smoke)" stroke-width="60" stroke-linecap="round"/>
    <path d="M20 160 C 180 120 340 190 460 150 C 560 120 660 180 820 130" fill="none" stroke="url(#lxf-bg-smoke)" stroke-width="46" stroke-linecap="round"/>
  </g>

  <!-- 玉青绿焰点缀（袍色呼应） -->
  <g filter="url(#lxf-bg-blur)" opacity="0.35">
    <path d="M120 300 C 160 280 200 300 240 286 C 290 268 320 292 360 278" fill="none" stroke="#37a875" stroke-width="8" stroke-linecap="round"/>
    <path d="M560 250 C 600 232 640 252 690 240 C 730 230 760 252 800 238" fill="none" stroke="#37a875" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
