<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" aria-hidden="true">
  <!-- 梦陆逊 · 焚灭 徽记：白鹿踏焰 · 玉青金环 -->
  <defs>
    <radialGradient id="lxf-circle" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#3a2a12"/>
      <stop offset="55%" stop-color="#241708"/>
      <stop offset="100%" stop-color="#150c05"/>
    </radialGradient>
    <radialGradient id="lxf-gold" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="0.4" stop-color="#f6d98a"/>
      <stop offset="0.8" stop-color="#c99436"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </radialGradient>
    <linearGradient id="lxf-jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0a6"/>
      <stop offset="0.5" stop-color="#2f9e63"/>
      <stop offset="1" stop-color="#145c3a"/>
    </linearGradient>
    <filter id="lxf-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 外焰环：金色分瓣火环（12 簇火舌） -->
  <g fill="url(#lxf-gold)">
    <circle cx="110" cy="110" r="102" fill="none" stroke="url(#lxf-gold)" stroke-width="3" opacity="0.9"/>
    <!-- 火舌瓣（环绕一圈） -->
    <g transform="translate(110,110)">
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(30)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(60)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(90)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(120)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(150)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(180)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(210)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(240)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(270)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(300)"/>
      <path d="M0 -96 C 6 -110 0 -118 -8 -128 C 12 -120 18 -108 10 -95 C 16 -99 18 -106 14 -113 Z" opacity="0.95" transform="rotate(330)"/>
    </g>
  </g>

  <!-- 内盘 -->
  <circle cx="110" cy="110" r="88" fill="url(#lxf-circle)" stroke="url(#lxf-gold)" stroke-width="2.4"/>
  <circle cx="110" cy="110" r="82" fill="none" stroke="url(#lxf-jade)" stroke-width="1.4" opacity="0.55"/>
  <circle cx="110" cy="110" r="80" fill="none" stroke="#f6d98a" stroke-width="0.8" opacity="0.4"/>

  <!-- 白鹿（成环而立的瑞兽，白身 + 玉青角 + 金瞳） -->
  <g filter="url(#lxf-glow)">
    <!-- 角：玉青分叉 -->
    <path d="M86 74 C 78 62 74 52 76 42 C 70 50 68 60 72 70 C 64 62 62 52 66 44 C 58 54 58 66 64 74 C 74 72 80 74 86 74 Z" fill="url(#lxf-jade)" opacity="0.92"/>
    <path d="M92 68 C 88 56 90 46 96 38 C 90 46 88 58 92 68 Z" fill="url(#lxf-jade)" opacity="0.92"/>
    <!-- 头颈 -->
    <path d="M88 78 C 84 86 82 94 84 100 L 100 100 C 104 92 106 84 104 78 Z" fill="#f4efe2"/>
    <path d="M86 82 C 82 88 80 96 82 100 L 92 100 C 92 92 92 84 90 78 Z" fill="#e6ddc9" opacity="0.6"/>
    <!-- 耳 -->
    <path d="M84 74 C 80 70 78 64 82 68 C 86 72 88 74 84 74 Z" fill="#e6ddc9"/>
    <!-- 躯干（流线奔跑之势） -->
    <path d="M84 100 C 92 96 112 94 122 100 C 134 106 142 114 144 122 C 146 122 146 124 144 124 C 132 124 112 124 96 122 C 92 116 86 108 84 100 Z" fill="#f4efe2"/>
    <!-- 前腿（并蹄而立） -->
    <path d="M92 120 C 90 132 88 144 86 154 L 92 154 C 94 144 96 132 96 120 Z" fill="#f4efe2"/>
    <path d="M100 121 C 99 134 98 146 97 156 L 103 156 C 104 146 105 134 105 121 Z" fill="#e6ddc9"/>
    <!-- 后腿 -->
    <path d="M128 122 C 130 134 131 146 131 156 L 137 156 C 137 146 137 134 135 122 Z" fill="#f4efe2"/>
    <!-- 尾（狐尾般的玉焰尾） -->
    <path d="M144 112 C 152 108 158 100 156 90 C 162 98 160 108 152 116 Z" fill="url(#lxf-jade)" opacity="0.85"/>
    <!-- 点睛（金瞳） -->
    <circle cx="88" cy="92" r="1.6" fill="#c99436" filter="url(#lxf-glow)"/>
    <!-- 蹄下玉焰 -->
    <path d="M84 156 C 88 162 94 164 100 162 C 104 166 108 168 106 162 C 110 166 114 164 114 158 L 92 158 Z" fill="url(#lxf-jade)" opacity="0.55"/>
  </g>
</svg>
