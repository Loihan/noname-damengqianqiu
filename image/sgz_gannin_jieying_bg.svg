<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 84" width="60" height="84" preserveAspectRatio="none">
  <!-- 梦甘宁 · 劫营 翡翠劫掠标记底纹：四角"锁定"括角 + 极淡的斜向扫描纹。
       真正的动态扫描线由 CSS 绘制，这里只提供静态纹理质感。 -->
  <defs>
    <linearGradient id="gnJyCorner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffc4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2fd6a6" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- 极淡斜向扫描纹 -->
  <g stroke="#4adf9a" stroke-opacity="0.05" stroke-width="0.8">
    <path d="M-10 30 L70 -10"/>
    <path d="M-10 52 L70 12"/>
    <path d="M-10 74 L70 34"/>
    <path d="M-10 96 L70 56"/>
  </g>

  <!-- 四角锁定括角 -->
  <g fill="none" stroke="url(#gnJyCorner)" stroke-width="2" stroke-linecap="round">
    <path d="M3 14 V3 H14"/>
    <path d="M46 3 H57 V14"/>
    <path d="M57 70 V81 H46"/>
    <path d="M14 81 H3 V70"/>
  </g>
</svg>
