<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 梦魏延 · 壮誓 徽记：反骨断刃（脊椎骨 × 血刃） -->
  <defs>
    <radialGradient id="wyFgAura" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#e0452a" stop-opacity="0.44"/>
      <stop offset="0.55" stop-color="#8d140f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8d140f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wyFgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e4b8"/>
      <stop offset="0.5" stop-color="#c9a45e"/>
      <stop offset="1" stop-color="#7d6330"/>
    </linearGradient>
    <linearGradient id="wyFgSteel" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4f1e6"/>
      <stop offset="0.4" stop-color="#b9c0bd"/>
      <stop offset="0.72" stop-color="#6e7776"/>
      <stop offset="1" stop-color="#3b4345"/>
    </linearGradient>
    <linearGradient id="wyFgBone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ecdc"/>
      <stop offset="0.55" stop-color="#cfc5ab"/>
      <stop offset="1" stop-color="#8e8672"/>
    </linearGradient>
    <linearGradient id="wyFgBlood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8452a"/>
      <stop offset="1" stop-color="#7c1210"/>
    </linearGradient>
  </defs>

  <!-- 血誓幽光 -->
  <circle cx="120" cy="116" r="106" fill="url(#wyFgAura)"/>

  <!-- 双环：金（外·断链） + 血（内） -->
  <circle cx="120" cy="120" r="106" fill="none" stroke="url(#wyFgGold)" stroke-width="1.6" opacity="0.55"
          stroke-dasharray="12 6"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#8d140f" stroke-width="0.9" opacity="0.5"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#wyFgGold)" stroke-width="0.7" opacity="0.28"/>

  <!-- 环侧小篆：反 / 骨 -->
  <g font-family="xiaozhuan, KaiTi, STKaiti, serif" font-size="27" fill="#c9a45e" opacity="0.7" text-anchor="middle">
    <text x="120" y="26">反</text>
    <text x="120" y="224">骨</text>
  </g>

  <!-- ① 脊椎骨（斜向 45°，象征反骨） -->
  <g transform="rotate(45 120 120)">
    <rect x="112" y="54" width="16" height="132" rx="8" fill="url(#wyFgBone)" stroke="#7f7761" stroke-width="1.2"/>
    <g fill="url(#wyFgBone)" stroke="#7f7761" stroke-width="1.2">
      <circle cx="106" cy="56" r="11"/>
      <circle cx="134" cy="56" r="11"/>
      <circle cx="106" cy="184" r="11"/>
      <circle cx="134" cy="184" r="11"/>
    </g>
    <!-- 骨缝 -->
    <g fill="none" stroke="#8e8672" stroke-width="0.9" opacity="0.7">
      <path d="M104 60 Q120 68 136 60"/>
      <path d="M104 180 Q120 188 136 180"/>
      <path d="M120 78 V162"/>
    </g>
  </g>

  <!-- ② 断刃（反向 45°，刃口带缺口＝叛逆） -->
  <g transform="rotate(-45 120 120)">
    <path d="M120 18 L134 56 L134 74 L124 69 L135 92 L135 148 Q130 176 120 196 Q110 176 105 148 L105 92 L116 97 L106 74 L106 56 Z"
          fill="url(#wyFgSteel)" stroke="#5d6668" stroke-width="1.2"/>
    <!-- 血槽 -->
    <path d="M120 40 V178" fill="none" stroke="#8d140f" stroke-width="1.1" opacity="0.6"/>
    <!-- 刃脊高光 -->
    <path d="M120 22 L120 190" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.35"/>
    <!-- 刃末血珠 -->
    <circle cx="120" cy="200" r="3.4" fill="url(#wyFgBlood)"/>
  </g>

  <!-- 交会处血誓宝石 -->
  <g>
    <circle cx="120" cy="120" r="11" fill="#1b1113" stroke="url(#wyFgGold)" stroke-width="1.6"/>
    <circle cx="120" cy="120" r="6.4" fill="url(#wyFgBlood)"/>
    <circle cx="117.6" cy="117.4" r="2.1" fill="#ffd9c0" opacity="0.9"/>
  </g>

  <!-- 血珠飞溅 -->
  <g fill="url(#wyFgBlood)" opacity="0.9">
    <circle cx="70" cy="182" r="3.2"/>
    <circle cx="60" cy="164" r="1.9"/>
    <circle cx="176" cy="62" r="2.6"/>
    <circle cx="188" cy="80" r="1.6"/>
  </g>
</svg>
