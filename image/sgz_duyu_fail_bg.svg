<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" preserveAspectRatio="none">
  <!-- 梦杜预 · 三陈「武库化烬」选择框底板（倾势·失败 / 神武之路）
       与成功版的「墨青武库·竹影兵架」镜像构图：同样的武库，但兵器架断裂、
       竹竿折去上半、墙面横贯幽紫铁裂，暗示"武库已崩，神兵当出"。 -->
  <defs>
    <linearGradient id="dyFbgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141127"/>
      <stop offset="0.48" stop-color="#0d0b18"/>
      <stop offset="1" stop-color="#05040a"/>
    </linearGradient>
    <radialGradient id="dyFbgGlow" cx="0.5" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#6a52d8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#2a2350" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#04030a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dyFbgForge" cx="0.5" cy="0.96" r="0.62">
      <stop offset="0" stop-color="#a98cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a98cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dyFbgSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7ea0" stop-opacity="0.06"/>
      <stop offset="0.45" stop-color="#c9d2e8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6f7ea0" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="dyFbgSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d2e8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5d6a86" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="dyFbgBolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c8ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a98cff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5a3fd0" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="dyFbgRune" x="0" y="0" width="36" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 15 V7 H12 V13 H7 V10 H16 V16" fill="none" stroke="#9aa8c4" stroke-width="1.4" stroke-opacity="0.5"/>
      <path d="M20 3 V11 H30 V5 H25 V8 H34 V2" fill="none" stroke="#a98cff" stroke-width="1.1" stroke-opacity="0.32"/>
    </pattern>
  </defs>

  <!-- 底色 -->
  <rect x="0" y="0" width="1000" height="660" fill="url(#dyFbgBase)"/>
  <rect x="0" y="0" width="1000" height="660" fill="url(#dyFbgGlow)"/>
  <rect x="0" y="0" width="1000" height="660" fill="url(#dyFbgForge)"/>

  <!-- 断墙：横贯画面的铁裂（与成功版整齐的兵架形成对照） -->
  <g fill="none" stroke="#8f7dff" stroke-opacity="0.4" stroke-width="1.6">
    <path d="M0 150 L120 138 L188 162 L300 130 L392 158 L470 132 L560 160 L660 136 L760 164 L860 140 L1000 158"/>
    <path d="M0 520 L96 534 L200 508 L318 540 L420 512 L520 542 L640 510 L742 540 L860 512 L1000 536"/>
  </g>
  <g fill="none" stroke="#d8c8ff" stroke-opacity="0.16" stroke-width="0.8">
    <path d="M0 154 L120 142 L188 166 L300 134 L392 162 L470 136 L560 164 L660 140 L760 168 L860 144 L1000 162"/>
    <path d="M0 524 L96 538 L200 512 L318 544 L420 516 L520 546 L640 514 L742 544 L860 516 L1000 540"/>
  </g>

  <!-- 裂纹：自画面中段向四外炸裂（破而后立） -->
  <g fill="none" stroke="#6a5ac0" stroke-opacity="0.28" stroke-width="1.1">
    <path d="M498 330 L430 268 L448 214 L392 168"/>
    <path d="M498 330 L588 262 L570 206 L638 156"/>
    <path d="M498 330 L412 402 L440 466 L376 520"/>
    <path d="M498 330 L596 396 L566 462 L640 516"/>
  </g>
  <g fill="none" stroke="#cdbcff" stroke-opacity="0.14" stroke-width="0.8">
    <path d="M498 334 L434 272 L452 218 L396 172"/>
    <path d="M498 334 L592 266 L574 210 L642 160"/>
    <path d="M498 334 L416 406 L444 470 L380 524"/>
    <path d="M498 334 L600 400 L570 466 L644 520"/>
  </g>

  <!-- 远景：折竹（只剩下半截，与成功版的整竿竹对照） -->
  <g>
    <g transform="translate(74 0)">
      <rect x="0" y="360" width="13" height="300" fill="url(#dyFbgSteel)"/>
      <g fill="#a98cff" fill-opacity="0.2">
        <rect x="-3" y="452" width="19" height="4" rx="2"/>
        <rect x="-3" y="576" width="19" height="4" rx="2"/>
      </g>
      <path d="M-2 360 L6 330 L16 358 L6 344 Z" fill="#c9d2e8" fill-opacity="0.3"/>
    </g>
    <g transform="translate(124 0)" opacity="0.7">
      <rect x="0" y="430" width="8" height="230" fill="url(#dyFbgSteel)"/>
      <path d="M-2 430 L4 408 L11 428 L5 418 Z" fill="#c9d2e8" fill-opacity="0.26"/>
    </g>
    <g transform="translate(888 0)">
      <rect x="0" y="330" width="13" height="330" fill="url(#dyFbgSteel)"/>
      <g fill="#a98cff" fill-opacity="0.2">
        <rect x="-3" y="430" width="19" height="4" rx="2"/>
        <rect x="-3" y="560" width="19" height="4" rx="2"/>
      </g>
      <path d="M-2 330 L6 300 L16 328 L6 314 Z" fill="#c9d2e8" fill-opacity="0.3"/>
    </g>
    <g transform="translate(936 0)" opacity="0.7">
      <rect x="0" y="420" width="8" height="240" fill="url(#dyFbgSteel)"/>
      <path d="M-2 420 L4 398 L11 418 L5 408 Z" fill="#c9d2e8" fill-opacity="0.26"/>
    </g>
  </g>

  <!-- 中景：断兵架（横梁被砸出缺口，挂着的兵器折断、只余半截） -->
  <g fill="url(#dyFbgSilver)" opacity="0.32">
    <!-- 上梁：断成三段 -->
    <path d="M150 92 H392 M470 92 H600 M660 92 H850"/>
    <!-- 下梁：断成两段 -->
    <path d="M150 566 H520 M600 566 H850"/>
  </g>
  <g fill="url(#dyFbgSilver)" opacity="0.38">
    <!-- 上梁垂挂的断兵 -->
    <path d="M186 92 v30 M186 96 l-16 -12 h-3 v9 h9 l10 6 Z"/>
    <path d="M240 92 v16 M240 96 l14 -11 h3 v8 h-8 l-9 5 Z"/>
    <path d="M404 92 v22 M404 95 l-13 -10 h-3 v8 h8 l8 5 Z"/>
    <path d="M760 92 v14 M760 95 l-15 -11 h-3 v9 h9 l9 5 Z"/>
    <path d="M814 92 v30 M814 96 l15 -12 h3 v9 h-9 l-9 6 Z"/>
    <!-- 下梁垂挂的断兵（倒置） -->
    <g transform="translate(0 660) scale(1 -1)">
      <path d="M300 92 v24 M300 95 l14 -11 h3 v8 h-8 l-9 5 Z"/>
      <path d="M700 92 v18 M700 96 l-15 -11 h-3 v9 h9 l9 5 Z"/>
    </g>
    <!-- 崩落的兵刃残片 -->
    <path d="M556 188 l16 46 l-14 -6 l-8 34 l-6 -40 Z" opacity="0.5"/>
    <path d="M366 470 l14 40 l-13 -5 l-7 30 l-5 -35 Z" opacity="0.5"/>
    <path d="M652 428 l11 32 l-10 -4 l-6 24 l-4 -28 Z" opacity="0.42"/>
  </g>

  <!-- 幽紫电光：沿主裂与断口游走 -->
  <g>
    <path d="M498 60 L488 150 L512 176 L482 268 L508 300 L474 388 L502 424 L470 520 L494 560 L486 616"
          fill="none" stroke="#5a3fd0" stroke-opacity="0.5" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M498 60 L488 150 L512 176 L482 268 L508 300 L474 388 L502 424 L470 520 L494 560 L486 616"
          fill="none" stroke="#d8c8ff" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round"/>
    <g stroke="url(#dyFbgBolt)" stroke-width="1.3" fill="none" opacity="0.75" stroke-linecap="round">
      <path d="M512 176 L556 190 L540 214 L578 226"/>
      <path d="M482 268 L430 280 L446 306 L404 318"/>
      <path d="M502 424 L558 436 L542 462 L588 474"/>
      <path d="M470 520 L414 532 L430 556 L384 566"/>
      <path d="M488 150 L440 160"/>
      <path d="M474 388 L424 398"/>
    </g>
  </g>

  <!-- 近景：冷银云雷纹上下边带 -->
  <g opacity="0.46">
    <rect x="0" y="0" width="1000" height="18" fill="url(#dyFbgRune)"/>
    <rect x="0" y="642" width="1000" height="18" fill="url(#dyFbgRune)"/>
  </g>

  <!-- 四角断角饰（缺口，与成功版完整的回纹角饰对照） -->
  <g fill="none" stroke="#9aa8c4" stroke-width="1.6" stroke-opacity="0.42">
    <path d="M6 42 V6 H42 M14 14 l10 10"/>
    <path d="M994 42 V6 H958 M986 14 l-10 10"/>
    <path d="M6 618 V654 H42 M14 646 l10 -10"/>
    <path d="M994 618 V654 H958 M986 646 l-10 -10"/>
  </g>

  <!-- 飞散火花 -->
  <g fill="#d8c8ff" opacity="0.7">
    <circle cx="536" cy="196" r="1.8"/>
    <circle cx="420" cy="288" r="1.5"/>
    <circle cx="566" cy="452" r="1.7"/>
    <circle cx="416" cy="540" r="1.4"/>
    <circle cx="600" cy="322" r="1.2"/>
    <circle cx="392" cy="386" r="1.2"/>
  </g>

  <!-- 暗角 -->
  <rect x="0" y="0" width="1000" height="660" fill="none" stroke="#000" stroke-opacity="0.58" stroke-width="26"/>
</svg>
