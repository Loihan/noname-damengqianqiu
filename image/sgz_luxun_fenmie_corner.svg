<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
  <!-- 梦陆逊 · 焚灭 角饰：左上角业火回纹（其余角用 transform:scaleX/scaleY 翻转） -->
  <defs>
    <linearGradient id="lxf-c-gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.5" stop-color="#f6d98a"/>
      <stop offset="1" stop-color="#fff3c4"/>
    </linearGradient>
    <linearGradient id="lxf-c-fire" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0e0e"/>
      <stop offset="0.5" stop-color="#e04818"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="lxf-c-jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0a6"/>
      <stop offset="1" stop-color="#145c3a"/>
    </linearGradient>
    <filter id="lxf-c-soft"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <g fill="none" stroke-linecap="round">
    <!-- 外侧金钩（右上角回纹钩边） -->
    <path d="M4 60 L4 14 C 4 8 8 4 14 4 L60 4" stroke="url(#lxf-c-gold)" stroke-width="3" filter="url(#lxf-c-soft)"/>
    <path d="M10 54 L10 20 C 10 15 15 10 20 10 L54 10" stroke="url(#lxf-c-gold)" stroke-width="2"/>
    <path d="M16 44 L16 26 C 16 21 21 16 26 16 L44 16" stroke="url(#lxf-c-gold)" stroke-width="1.2" opacity="0.8"/>

    <!-- 内角业火回纹（玉青朝内） -->
    <path d="M60 4 L60 22 C 60 30 54 34 48 34 L30 34 C 26 34 22 38 22 42 L22 60" stroke="url(#lxf-c-jade)" stroke-width="1.6" opacity="0.9"/>
    <path d="M54 8 L54 20 C 54 26 50 30 44 30 L30 30" stroke="url(#lxf-c-jade)" stroke-width="1.1" opacity="0.7"/>

    <!-- 火舌升腾（从角落向上的两簇小焰） -->
    <g filter="url(#lxf-c-soft)">
      <path d="M34 20 C 30 12 30 6 34 0 C 38 6 40 12 38 20 C 37 22 35 22 34 20 Z" fill="url(#lxf-c-fire)" opacity="0.9"/>
      <path d="M20 26 C 17 20 17 14 20 8 C 23 14 24 20 23 26 Z" fill="url(#lxf-c-fire)" opacity="0.75"/>
      <circle cx="48" cy="6" r="2" fill="#ffd27a" opacity="0.9"/>
      <circle cx="12" cy="42" r="1.6" fill="#ffd27a" opacity="0.8"/>
    </g>
  </g>
</svg>
