<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" preserveAspectRatio="none">
  <!-- 梦甘宁 · 夜魇 隐匿埋伏暗幕底纹：暗紫的阴影游丝，自边缘向内洇开。
       真正的主导渐变由 CSS radial-gradient 提供，这里只叠加"阴影中的动静"纹理。 -->
  <defs>
    <radialGradient id="gnYyMist" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#2a1f5e" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#2a1f5e" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#160f38" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="gnYyWisp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5ac8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6a5ac8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6a5ac8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="url(#gnYyMist)"/>

  <!-- 阴影游丝 -->
  <g fill="none" stroke="url(#gnYyWisp)" stroke-width="0.9" stroke-linecap="round">
    <path d="M-5 8 C 22 14, 40 6, 52 16"/>
    <path d="M-5 26 C 16 30, 34 22, 44 32"/>
    <path d="M-5 58 C 20 62, 38 54, 50 64"/>
    <path d="M-5 78 C 24 84, 42 76, 56 86"/>
    <path d="M60 92 C 78 84, 90 78, 105 70"/>
    <path d="M56 -4 C 74 2, 88 -2, 105 6"/>
  </g>
</svg>
